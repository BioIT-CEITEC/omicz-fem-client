services:
  fem-client:
    build: ./
    container_name: fem-client
    image: registry.gitlab.bsc.es/fl/fem-client:v2.3.2
    environment:
      - UID=${UID}
      - GID=${GID}
      - USER_NAME=${USER_NAME}
      - DOCKER_GID=${DOCKER_GID}
      - HOST_FEMC_PATH=${HOST_FEMC_PATH}
      - SANDBOX_PATH=/sandbox
      - DATA_PATH=/data
      - LOG_FILE=/app/receiver.log
    volumes:
      - ./config:/app/config
      - ./app/receiver.log:/app/receiver.log
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_PATH}:/data:ro
      - ${SANDBOX_PATH}:/sandbox:shared
    restart: always
    stdin_open: true
    tty: true
    entrypoint: ["/app/entrypoint.sh"]